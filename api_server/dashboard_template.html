<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일점검서버 - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* NeoGlass Dark - Enhanced */
            --bg: #0b1020;
            --panel: rgba(17, 25, 40, 0.70);
            --panel-strong: rgba(17, 25, 40, 0.85);
            --border: rgba(148, 163, 184, 0.22);
            --border-bright: rgba(94, 234, 212, 0.35);
            --text: #e5e7eb;
            --muted: rgba(203, 213, 225, 0.72);
            --primary: #5eead4;
            --primary-2: #38bdf8;
            --primary-glow: rgba(94, 234, 212, 0.4);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #fb7185;
            
            /* Enhanced Shadows */
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.45);
            --shadow-multi: 0 8px 32px rgba(0, 0, 0, 0.4), 
                           0 2px 8px rgba(0, 0, 0, 0.2),
                           inset 0 1px 0 rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(94, 234, 212, 0.3);
            --shadow-glow-strong: 0 0 40px rgba(94, 234, 212, 0.5);
            
            --radius: 16px;
            --radius-sm: 12px;
            --radius-lg: 24px;
            
            /* Enhanced Glass Effects */
            --glass-blur: 28px;
            --glass-blur-strong: 40px;
            --border-glow: 0 0 20px rgba(94, 234, 212, 0.3);
            
            /* Spacing System */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }
        
        /* 커스텀 스크롤바 - 다크 테마 */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(94, 234, 212, 0.4) rgba(15, 23, 42, 0.3);
        }

        *::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        *::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
        }

        *::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(94, 234, 212, 0.5), rgba(56, 189, 248, 0.5));
            border-radius: 10px;
            border: 2px solid rgba(15, 23, 42, 0.3);
            transition: all 0.3s ease;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(94, 234, 212, 0.7), rgba(56, 189, 248, 0.7));
            border-color: rgba(15, 23, 42, 0.5);
        }

        *::-webkit-scrollbar-thumb:active {
            background: linear-gradient(180deg, var(--primary), var(--primary-2));
        }

        *::-webkit-scrollbar-corner {
            background: rgba(15, 23, 42, 0.3);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background:
                radial-gradient(1200px circle at 10% 0%, rgba(94, 234, 212, 0.25), transparent 50%),
                radial-gradient(1200px circle at 90% 10%, rgba(56, 189, 248, 0.22), transparent 50%),
                radial-gradient(1000px circle at 50% 100%, rgba(251, 113, 133, 0.15), transparent 55%),
                radial-gradient(800px circle at 30% 50%, rgba(139, 92, 246, 0.12), transparent 50%),
                var(--bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-attachment: fixed;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: -0.01em;
        }
        
        /* Typography System */
        h1, .h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-bottom: var(--spacing-sm);
        }
        
        h2, .h2 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-sm);
        }
        
        h3, .h3 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: -0.01em;
            margin-bottom: var(--spacing-sm);
        }
        
        h4, .h4 {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.01em;
            margin-bottom: var(--spacing-xs);
        }
        
        .text-sm {
            font-size: 12px;
            line-height: 1.5;
        }
        
        .text-xs {
            font-size: 11px;
            line-height: 1.4;
        }
        
        .text-lg {
            font-size: 16px;
            line-height: 1.6;
        }
        
        .text-xl {
            font-size: 20px;
            line-height: 1.5;
        }
        
        .font-bold {
            font-weight: 700;
        }
        
        .font-semibold {
            font-weight: 600;
        }
        
        .font-medium {
            font-weight: 500;
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: var(--panel-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-multi);
            backdrop-filter: blur(var(--glass-blur-strong));
            padding: 24px 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }
        
        .header-left {
            flex: 1;
            min-width: 0;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.05) 0%, rgba(56, 189, 248, 0.05) 100%);
            pointer-events: none;
        }
        
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.5), transparent);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.03em;
            line-height: 1.2;
            position: relative;
        }

        .header-subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--panel-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-multi);
            backdrop-filter: blur(var(--glass-blur-strong));
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.03) 0%, rgba(56, 189, 248, 0.03) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-multi), var(--shadow-glow);
            border-color: var(--border-bright);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
            text-shadow: 0 0 30px rgba(94, 234, 212, 0.3);
            filter: drop-shadow(0 0 20px rgba(94, 234, 212, 0.2));
            position: relative;
        }

        .stat-label {
            font-size: 14px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .stat-item {
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.3));
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            backdrop-filter: blur(var(--glass-blur));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.1), rgba(56, 189, 248, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm), var(--border-glow);
            border-color: var(--border-bright);
        }
        
        .stat-item:hover::before {
            opacity: 1;
        }

        .stat-item-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: var(--spacing-xs);
            position: relative;
        }

        .stat-item-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .project-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .project-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .project-item:hover {
            background: rgba(2, 6, 23, 0.22);
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-name {
            font-weight: 600;
            color: var(--text);
        }

        .project-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            backdrop-filter: blur(var(--glass-blur));
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .status-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .status-running {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.25), rgba(16, 185, 129, 0.2));
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: var(--shadow-sm), 0 0 20px rgba(16, 185, 129, 0.3);
            animation: statusPulse 2s ease-in-out infinite;
        }
        
        @keyframes statusPulse {
            0%, 100% {
                box-shadow: var(--shadow-sm), 0 0 20px rgba(16, 185, 129, 0.3);
            }
            50% {
                box-shadow: var(--shadow-sm), 0 0 30px rgba(16, 185, 129, 0.5);
            }
        }

        .status-idle {
            background: linear-gradient(135deg, rgba(203, 213, 225, 0.2), rgba(148, 163, 184, 0.15));
            color: var(--muted);
            border: 1px solid var(--border);
        }
        
        .status-badge span:first-child {
            font-size: 10px;
            filter: drop-shadow(0 0 4px currentColor);
        }

        .recent-jobs {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .job-item {
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.3));
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(var(--glass-blur));
            position: relative;
            overflow: visible;
            cursor: pointer;
        }
        
        .job-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary), var(--primary-2));
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .job-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.08), rgba(56, 189, 248, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .job-item:hover {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.5));
            transform: translateX(4px) translateY(-2px);
            box-shadow: var(--shadow-sm), var(--border-glow);
            border-color: var(--border-bright);
        }
        
        .job-item:hover::before {
            opacity: 1;
        }
        
        .job-item:hover::after {
            opacity: 1;
        }
        
        .job-item.status-success-item {
            border-left-color: var(--success);
        }
        
        .job-item.status-success-item::before {
            background: linear-gradient(180deg, var(--success), #10b981);
        }
        
        .job-item.status-warning-item {
            border-left-color: var(--warning);
        }
        
        .job-item.status-warning-item::before {
            background: linear-gradient(180deg, var(--warning), #f59e0b);
        }
        
        .job-item.status-error-item {
            border-left-color: var(--danger);
        }
        
        .job-item.status-error-item::before {
            background: linear-gradient(180deg, var(--danger), #ef4444);
        }

        .job-info {
            flex: 1;
            flex-shrink: 1;
            min-width: 0;
            position: relative;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: visible;
        }

        .job-name {
            font-weight: 700;
            color: var(--text);
            margin-bottom: var(--spacing-sm);
            font-size: 17px;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .job-meta {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-lg);
            font-weight: 600;
            margin-top: 4px;
        }
        
        .job-meta span {
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .job-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            backdrop-filter: blur(var(--glass-blur));
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin-left: var(--spacing-md);
        }
        
        .job-status:hover {
            transform: scale(1.05);
        }

        .status-success {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.25), rgba(16, 185, 129, 0.2));
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: var(--shadow-sm), 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .status-warning {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.2));
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.4);
            box-shadow: var(--shadow-sm), 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .status-error {
            background: linear-gradient(135deg, rgba(251, 113, 133, 0.25), rgba(239, 68, 68, 0.2));
            color: var(--danger);
            border: 1px solid rgba(251, 113, 133, 0.4);
            box-shadow: var(--shadow-sm), 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .quick-action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .action-button {
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.3));
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            backdrop-filter: blur(var(--glass-blur));
            position: relative;
            overflow: hidden;
        }
        
        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .action-button:hover::before {
            left: 100%;
        }

        .action-button:hover {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.5));
            border-color: var(--border-bright);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-sm), var(--border-glow);
        }
        
        .action-button:active {
            transform: translateY(0) scale(0.98);
        }

        .action-button.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            border-color: rgba(94, 234, 212, 0.4);
            color: #0a0e1a;
            box-shadow: var(--shadow-glow), var(--shadow-sm);
        }
        
        .action-button.primary::before {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .action-button.primary:hover {
            background: linear-gradient(135deg, #2dd4bf 0%, #60a5fa 100%);
            box-shadow: var(--shadow-glow-strong), var(--shadow);
            border-color: rgba(94, 234, 212, 0.6);
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--muted);
            font-size: 14px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.2));
            border-radius: var(--radius-sm);
            border: 1px dashed var(--border);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading::before {
            content: '';
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 999px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 10px rgba(94, 234, 212, 0.3);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Enhanced Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Stagger Animation for Cards */
        .card {
            animation: fadeInUp 0.5s ease-out backwards;
        }
        
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(n+6) { animation-delay: 0.3s; }
        
        /* Stagger Animation for List Items */
        .project-item {
            animation: slideInRight 0.4s ease-out backwards;
        }
        
        .project-item:nth-child(1) { animation-delay: 0.05s; }
        .project-item:nth-child(2) { animation-delay: 0.1s; }
        .project-item:nth-child(3) { animation-delay: 0.15s; }
        .project-item:nth-child(4) { animation-delay: 0.2s; }
        .project-item:nth-child(5) { animation-delay: 0.25s; }
        .project-item:nth-child(n+6) { animation-delay: 0.3s; }
        
        .job-item {
            animation: slideInRight 0.4s ease-out backwards;
        }
        
        .job-item:nth-child(1) { animation-delay: 0.05s; }
        .job-item:nth-child(2) { animation-delay: 0.1s; }
        .job-item:nth-child(3) { animation-delay: 0.15s; }
        .job-item:nth-child(4) { animation-delay: 0.2s; }
        .job-item:nth-child(5) { animation-delay: 0.25s; }
        .job-item:nth-child(n+6) { animation-delay: 0.3s; }
        
        /* Smooth Transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }
        
        /* Micro-interactions */
        button:active,
        .project-item:active,
        .job-item:active {
            transform: scale(0.98);
        }
        
        /* Smooth Page Load Animation */
        .dashboard-container {
            animation: fadeIn 0.6s ease-out;
        }
        
        .header {
            animation: slideInRight 0.5s ease-out 0.1s backwards;
        }
        
        .dashboard-grid {
            animation: fadeInUp 0.5s ease-out 0.2s backwards;
        }

    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div class="header-left">
                <h1>Dashboard</h1>
                <div class="header-subtitle">일일점검서버 모니터링 대시보드</div>
            </div>
            <div class="header-right">
                <a href="/api/report" class="action-button primary" style="text-decoration: none; display: inline-block; color: inherit;">
                    전체 결과 보기 →
                </a>
            </div>
        </div>

        <!-- 실행 요약 표시 (Total) -->
        <div class="dashboard-grid">
            <div class="card stat-card">
                <div class="card-title">실행 요약</div>
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">전체 점검 횟수</div>
                <div class="stat-grid" id="summaryStats">
                    <!-- 동적으로 생성 -->
                </div>
            </div>

            <!-- 현재 실행 상태 표시 (Status) -->
            <div class="card">
                <div class="card-title">현재 실행 상태</div>
                <div id="currentStatus" class="status-badge status-idle">
                    <span>●</span>
                    <span>대기 중</span>
                </div>
                <div style="margin-top: 16px; font-size: 14px; color: var(--muted);">
                    실행 중인 작업이 없습니다.
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- 프로젝트 목록 -->
            <div class="card">
                <div class="card-title">프로젝트 목록</div>
                <div class="project-list" id="projectList">
                    <div class="loading">로딩 중...</div>
                </div>
            </div>

            <!-- 최근 실행 작업 -->
            <div class="card">
                <div class="card-title">최근 실행 작업</div>
                <div class="recent-jobs" id="recentJobs">
                    <div class="loading">로딩 중...</div>
                </div>
            </div>
        </div>

        <!-- 빠른 작업 실행 버튼 -->
        <div class="card">
            <div class="card-title">빠른 작업 실행</div>
            <div class="quick-action-buttons">
                <button class="action-button primary" onclick="runCheck('os')">
                    OS 점검 실행
                </button>
                <button class="action-button" onclick="runCheck('mariadb')">
                    MariaDB 점검
                </button>
                <button class="action-button" onclick="runCheck('postgresql')">
                    PostgreSQL 점검
                </button>
                <button class="action-button" onclick="runCheck('was')">
                    WAS 점검
                </button>
                <button class="action-button" onclick="runCheck('cubrid')">
                    CUBRID 점검
                </button>
            </div>
        </div>
    </div>

    <script>
        let dashboardData = null;

        // 대시보드 데이터 로드
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const data = await response.json();
                
                if (data.success) {
                    dashboardData = data;
                    updateDashboard(data);
                }
            } catch (error) {
                console.error('대시보드 데이터 로드 실패:', error);
            }
        }

        // 대시보드 업데이트
        function updateDashboard(data) {
            // 전체 통계
            document.getElementById('totalCount').textContent = data.summary.total || 0;

            // 점검 유형별 통계
            const summaryStats = document.getElementById('summaryStats');
            summaryStats.innerHTML = '';
            
            const typeStats = data.summary.by_type || {};
            for (const [type, count] of Object.entries(typeStats)) {
                const statItem = document.createElement('div');
                statItem.className = 'stat-item';
                statItem.innerHTML = `
                    <div class="stat-item-value">${count}</div>
                    <div class="stat-item-label">${type.toUpperCase()}</div>
                `;
                summaryStats.appendChild(statItem);
            }

            // 프로젝트 목록
            const projectList = document.getElementById('projectList');
            if (data.projects && data.projects.length > 0) {
                projectList.innerHTML = '';
                data.projects.forEach((project, index) => {
                    const item = document.createElement('div');
                    item.className = 'project-item';
                    item.style.cursor = 'pointer';
                    item.style.animationDelay = `${0.05 * index}s`;
                    const lastCheck = project.last_check ? new Date(project.last_check).toLocaleString('ko-KR') : 'N/A';
                    item.innerHTML = `
                        <div>
                            <div class="project-name">${project.hostname}</div>
                        </div>
                        <div class="project-meta">
                            <span>${project.count}회</span>
                            <span>${lastCheck}</span>
                        </div>
                    `;
                    // 프로젝트 클릭 시 해당 호스트의 리포트로 이동
                    item.addEventListener('click', () => {
                        // 통합 리포트로 이동 (호스트명 필터 적용)
                        window.location.href = `/api/report?hostname=${encodeURIComponent(project.hostname)}`;
                    });
                    projectList.appendChild(item);
                });
            } else {
                projectList.innerHTML = '<div class="empty-state">프로젝트가 없습니다</div>';
            }

            // 최근 실행 작업
            const recentJobs = document.getElementById('recentJobs');
            if (data.recent_checks && data.recent_checks.length > 0) {
                recentJobs.innerHTML = '';
                data.recent_checks.forEach((job, index) => {
                    const item = document.createElement('div');
                    const statusClass = job.status === 'success' ? 'status-success' : 
                                       job.status === 'warning' ? 'status-warning' : 'status-error';
                    const statusItemClass = job.status === 'success' ? 'status-success-item' : 
                                            job.status === 'warning' ? 'status-warning-item' : 'status-error-item';
                    item.className = `job-item ${statusItemClass}`;
                    item.style.cursor = 'pointer';
                    item.style.animationDelay = `${0.05 * index}s`;
                    const statusText = job.status === 'success' ? '성공' : 
                                      job.status === 'warning' ? '경고' : '실패';
                    const checkTime = job.check_time ? new Date(job.check_time).toLocaleString('ko-KR') : 'N/A';
                    item.innerHTML = `
                        <div class="job-info">
                            <div class="job-name">${job.hostname} - ${job.check_type.toUpperCase()}</div>
                            <div class="job-meta">
                                <span>담당자: ${job.checker || 'N/A'}</span>
                                <span>${checkTime}</span>
                            </div>
                        </div>
                        <div class="job-status ${statusClass}">${statusText}</div>
                    `;
                    // 작업 클릭 시 상세 보기로 이동
                    item.addEventListener('click', () => {
                        viewJobDetail(job);
                    });
                    recentJobs.appendChild(item);
                });
            } else {
                recentJobs.innerHTML = '<div class="empty-state">최근 실행 작업이 없습니다</div>';
            }
        }

        // 빠른 작업 실행
        async function runCheck(checkType) {
            const checkTypeMap = {
                'os': 'redhat',
                'mariadb': 'mariadb',
                'postgresql': 'postgresql',
                'was': 'tomcat',
                'tomcat': 'tomcat',
                'cubrid': 'cubrid'
            };
            
            const playbookName = checkTypeMap[checkType] || checkType;
            const playbookPath = `${playbookName}_check/${playbookName}_check.yml`;
            
            // 실행 확인
            const confirmed = confirm(
                `${checkType.toUpperCase()} 점검을 실행하시겠습니까?\n\n` +
                `실행 명령어:\nansible-playbook -i hosts.ini ${playbookPath}\n\n` +
                `실제 실행은 서버에서 직접 수행해야 합니다.`
            );
            
            if (confirmed) {
                // 실행 상태 업데이트
                updateExecutionStatus('running', checkType);
                
                // 실행 API 호출 시도
                try {
                    const response = await fetch(`/api/tasks/run?check_type=${checkType}`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        // 실행 성공
                        updateExecutionStatus('running', checkType, result.task_id);
                        alert(`✅ ${checkType.toUpperCase()} 점검 실행이 시작되었습니다.\n\n작업 ID: ${result.task_id}\n\n점검 완료 후 Dashboard에서 결과를 확인할 수 있습니다.`);
                        // 대시보드 새로고침 (5초 후)
                        setTimeout(() => {
                            loadDashboard();
                            updateExecutionStatus('idle');
                        }, 5000);
                    } else {
                        // 실행 API가 없는 경우 안내
                        updateExecutionStatus('idle');
                        showExecutionGuide(checkType, playbookPath);
                    }
                } catch (error) {
                    // 실행 API가 없는 경우 안내
                    updateExecutionStatus('idle');
                    console.error('실행 오류:', error);
                    showExecutionGuide(checkType, playbookPath);
                }
            }
        }

        // 실행 상태 업데이트
        function updateExecutionStatus(status, checkType = null, taskId = null) {
            const statusElement = document.getElementById('currentStatus');
            const statusText = document.querySelector('#currentStatus + div');
            
            if (status === 'running') {
                statusElement.className = 'status-badge status-running';
                statusElement.innerHTML = `<span>●</span><span>실행 중</span>`;
                if (statusText) {
                    statusText.textContent = `${checkType ? checkType.toUpperCase() : ''} 점검이 실행 중입니다...${taskId ? ` (작업 ID: ${taskId})` : ''}`;
                }
            } else {
                statusElement.className = 'status-badge status-idle';
                statusElement.innerHTML = `<span>●</span><span>대기 중</span>`;
                if (statusText) {
                    statusText.textContent = '실행 중인 작업이 없습니다.';
                }
            }
        }

        // 실행 가이드 표시
        function showExecutionGuide(checkType, playbookPath) {
            const checkTypeMap = {
                'os': 'redhat',
                'mariadb': 'mariadb',
                'postgresql': 'postgresql',
                'was': 'tomcat',
                'tomcat': 'tomcat',
                'cubrid': 'cubrid'
            };
            
            const playbookName = checkTypeMap[checkType] || checkType;
            const actualPath = `${playbookName}_check/${playbookName}_check.yml`;
            
            const guide = `
${checkType.toUpperCase()} 점검 실행 방법:

1. 터미널에서 다음 명령어 실행:
   cd /home/sth0824/ansible
   ansible-playbook -i hosts.ini ${actualPath}

2. 또는 특정 호스트만 점검:
   ansible-playbook -i hosts.ini ${actualPath} --limit nimbus-server

3. 점검 완료 후 Dashboard에서 결과 확인 가능합니다.
            `;
            alert(guide);
        }

        // 작업 상세 보기
        function viewJobDetail(job) {
            // 점검 유형에 따라 적절한 리포트 페이지로 이동
            let reportUrl = '/api/report';
            
            if (job.check_type === 'mariadb' || job.check_type === 'postgresql' || job.check_type === 'cubrid') {
                reportUrl = '/api/db-checks/report';
            } else if (job.check_type === 'os') {
                reportUrl = '/api/os-checks/report';
            } else if (job.check_type === 'was' || job.check_type === 'tomcat') {
                reportUrl = '/api/was-checks/report';
            }
            
            // 호스트명 필터 적용
            window.location.href = `${reportUrl}?hostname=${encodeURIComponent(job.hostname)}&id=${job.id}`;
        }

        // 주기적으로 데이터 갱신 (30초마다)
        function startAutoRefresh() {
            loadDashboard();
            setInterval(loadDashboard, 30000);
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            startAutoRefresh();
        });
    </script>
</body>
</html>
