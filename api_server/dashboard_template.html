<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일점검서버 - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* NeoGlass Dark */
            --bg: #0b1020;
            --panel: rgba(17, 25, 40, 0.62);
            --border: rgba(148, 163, 184, 0.18);
            --text: #e5e7eb;
            --muted: rgba(203, 213, 225, 0.72);
            --primary: #5eead4;
            --primary-2: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #fb7185;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.45);
            --radius: 16px;
            --glass-blur: 18px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background:
                radial-gradient(900px circle at 12% 0%, rgba(94, 234, 212, 0.18), transparent 55%),
                radial-gradient(900px circle at 86% 10%, rgba(56, 189, 248, 0.16), transparent 55%),
                radial-gradient(700px circle at 50% 110%, rgba(251, 113, 133, 0.10), transparent 60%),
                var(--bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(var(--glass-blur));
            padding: 24px 28px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .header-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(var(--glass-blur));
            padding: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: rgba(2, 6, 23, 0.22);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stat-item-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .stat-item-label {
            font-size: 12px;
            color: var(--muted);
        }

        .project-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .project-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .project-item:hover {
            background: rgba(2, 6, 23, 0.22);
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-name {
            font-weight: 600;
            color: var(--text);
        }

        .project-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-running {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .status-idle {
            background: rgba(203, 213, 225, 0.15);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .recent-jobs {
            max-height: 400px;
            overflow-y: auto;
        }

        .job-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .job-item:hover {
            background: rgba(2, 6, 23, 0.22);
        }

        .job-item:last-child {
            border-bottom: none;
        }

        .job-info {
            flex: 1;
        }

        .job-name {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .job-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 12px;
        }

        .job-status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-success {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
        }

        .status-warning {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
        }

        .status-error {
            background: rgba(251, 113, 133, 0.15);
            color: var(--danger);
        }

        .quick-action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .action-button {
            padding: 16px;
            background: rgba(2, 6, 23, 0.30);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            backdrop-filter: blur(var(--glass-blur));
        }

        .action-button:hover {
            background: rgba(2, 6, 23, 0.45);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .action-button.primary {
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.2), rgba(56, 189, 248, 0.2));
            border-color: rgba(94, 234, 212, 0.4);
        }

        .action-button.primary:hover {
            background: linear-gradient(135deg, rgba(94, 234, 212, 0.3), rgba(56, 189, 248, 0.3));
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading::before {
            content: '';
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 999px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 스크롤바 스타일 */
        .project-list::-webkit-scrollbar,
        .recent-jobs::-webkit-scrollbar {
            width: 8px;
        }

        .project-list::-webkit-scrollbar-track,
        .recent-jobs::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
        }

        .project-list::-webkit-scrollbar-thumb,
        .recent-jobs::-webkit-scrollbar-thumb {
            background: rgba(94, 234, 212, 0.4);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>Dashboard</h1>
            <div class="header-subtitle">일일점검서버 모니터링 대시보드</div>
        </div>

        <!-- 실행 요약 표시 (Total) -->
        <div class="dashboard-grid">
            <div class="card stat-card">
                <div class="card-title">실행 요약</div>
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">전체 점검 횟수</div>
                <div class="stat-grid" id="summaryStats">
                    <!-- 동적으로 생성 -->
                </div>
            </div>

            <!-- 현재 실행 상태 표시 (Status) -->
            <div class="card">
                <div class="card-title">현재 실행 상태</div>
                <div id="currentStatus" class="status-badge status-idle">
                    <span>●</span>
                    <span>대기 중</span>
                </div>
                <div style="margin-top: 16px; font-size: 14px; color: var(--muted);">
                    실행 중인 작업이 없습니다.
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- 프로젝트 목록 -->
            <div class="card">
                <div class="card-title">프로젝트 목록</div>
                <div class="project-list" id="projectList">
                    <div class="loading">로딩 중...</div>
                </div>
            </div>

            <!-- 최근 실행 작업 -->
            <div class="card">
                <div class="card-title">최근 실행 작업</div>
                <div class="recent-jobs" id="recentJobs">
                    <div class="loading">로딩 중...</div>
                </div>
            </div>
        </div>

        <!-- 빠른 작업 실행 버튼 -->
        <div class="card">
            <div class="card-title">빠른 작업 실행</div>
            <div class="quick-action-buttons">
                <button class="action-button primary" onclick="runCheck('os')">
                    OS 점검 실행
                </button>
                <button class="action-button" onclick="runCheck('mariadb')">
                    MariaDB 점검
                </button>
                <button class="action-button" onclick="runCheck('postgresql')">
                    PostgreSQL 점검
                </button>
                <button class="action-button" onclick="runCheck('was')">
                    WAS 점검
                </button>
                <button class="action-button" onclick="runCheck('cubrid')">
                    CUBRID 점검
                </button>
            </div>
        </div>
    </div>

    <script>
        let dashboardData = null;

        // 대시보드 데이터 로드
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const data = await response.json();
                
                if (data.success) {
                    dashboardData = data;
                    updateDashboard(data);
                }
            } catch (error) {
                console.error('대시보드 데이터 로드 실패:', error);
            }
        }

        // 대시보드 업데이트
        function updateDashboard(data) {
            // 전체 통계
            document.getElementById('totalCount').textContent = data.summary.total || 0;

            // 점검 유형별 통계
            const summaryStats = document.getElementById('summaryStats');
            summaryStats.innerHTML = '';
            
            const typeStats = data.summary.by_type || {};
            for (const [type, count] of Object.entries(typeStats)) {
                const statItem = document.createElement('div');
                statItem.className = 'stat-item';
                statItem.innerHTML = `
                    <div class="stat-item-value">${count}</div>
                    <div class="stat-item-label">${type.toUpperCase()}</div>
                `;
                summaryStats.appendChild(statItem);
            }

            // 프로젝트 목록
            const projectList = document.getElementById('projectList');
            if (data.projects && data.projects.length > 0) {
                projectList.innerHTML = '';
                data.projects.forEach(project => {
                    const item = document.createElement('div');
                    item.className = 'project-item';
                    item.style.cursor = 'pointer';
                    const lastCheck = project.last_check ? new Date(project.last_check).toLocaleString('ko-KR') : 'N/A';
                    item.innerHTML = `
                        <div>
                            <div class="project-name">${project.hostname}</div>
                        </div>
                        <div class="project-meta">
                            <span>${project.count}회</span>
                            <span>${lastCheck}</span>
                        </div>
                    `;
                    // 프로젝트 클릭 시 해당 호스트의 리포트로 이동
                    item.addEventListener('click', () => {
                        // 통합 리포트로 이동 (호스트명 필터 적용)
                        window.location.href = `/api/report?hostname=${encodeURIComponent(project.hostname)}`;
                    });
                    projectList.appendChild(item);
                });
            } else {
                projectList.innerHTML = '<div class="empty-state">프로젝트가 없습니다</div>';
            }

            // 최근 실행 작업
            const recentJobs = document.getElementById('recentJobs');
            if (data.recent_checks && data.recent_checks.length > 0) {
                recentJobs.innerHTML = '';
                data.recent_checks.forEach(job => {
                    const item = document.createElement('div');
                    item.className = 'job-item';
                    item.style.cursor = 'pointer';
                    const statusClass = job.status === 'success' ? 'status-success' : 
                                       job.status === 'warning' ? 'status-warning' : 'status-error';
                    const statusText = job.status === 'success' ? '성공' : 
                                      job.status === 'warning' ? '경고' : '실패';
                    const checkTime = job.check_time ? new Date(job.check_time).toLocaleString('ko-KR') : 'N/A';
                    item.innerHTML = `
                        <div class="job-info">
                            <div class="job-name">${job.hostname} - ${job.check_type.toUpperCase()}</div>
                            <div class="job-meta">
                                <span>담당자: ${job.checker || 'N/A'}</span>
                                <span>${checkTime}</span>
                            </div>
                        </div>
                        <div class="job-status ${statusClass}">${statusText}</div>
                    `;
                    // 작업 클릭 시 상세 보기로 이동
                    item.addEventListener('click', () => {
                        viewJobDetail(job);
                    });
                    recentJobs.appendChild(item);
                });
            } else {
                recentJobs.innerHTML = '<div class="empty-state">최근 실행 작업이 없습니다</div>';
            }
        }

        // 빠른 작업 실행
        async function runCheck(checkType) {
            const checkTypeMap = {
                'os': 'redhat',
                'mariadb': 'mariadb',
                'postgresql': 'postgresql',
                'was': 'tomcat',
                'tomcat': 'tomcat',
                'cubrid': 'cubrid'
            };
            
            const playbookName = checkTypeMap[checkType] || checkType;
            const playbookPath = `${playbookName}_check/${playbookName}_check.yml`;
            
            // 실행 확인
            const confirmed = confirm(
                `${checkType.toUpperCase()} 점검을 실행하시겠습니까?\n\n` +
                `실행 명령어:\nansible-playbook -i hosts.ini ${playbookPath}\n\n` +
                `실제 실행은 서버에서 직접 수행해야 합니다.`
            );
            
            if (confirmed) {
                // 실행 상태 업데이트
                updateExecutionStatus('running', checkType);
                
                // 실행 API 호출 시도
                try {
                    const response = await fetch(`/api/tasks/run?check_type=${checkType}`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    
                    if (response.ok && result.success) {
                        // 실행 성공
                        updateExecutionStatus('running', checkType, result.task_id);
                        alert(`✅ ${checkType.toUpperCase()} 점검 실행이 시작되었습니다.\n\n작업 ID: ${result.task_id}\n\n점검 완료 후 Dashboard에서 결과를 확인할 수 있습니다.`);
                        // 대시보드 새로고침 (5초 후)
                        setTimeout(() => {
                            loadDashboard();
                            updateExecutionStatus('idle');
                        }, 5000);
                    } else {
                        // 실행 API가 없는 경우 안내
                        updateExecutionStatus('idle');
                        showExecutionGuide(checkType, playbookPath);
                    }
                } catch (error) {
                    // 실행 API가 없는 경우 안내
                    updateExecutionStatus('idle');
                    console.error('실행 오류:', error);
                    showExecutionGuide(checkType, playbookPath);
                }
            }
        }

        // 실행 상태 업데이트
        function updateExecutionStatus(status, checkType = null, taskId = null) {
            const statusElement = document.getElementById('currentStatus');
            const statusText = document.querySelector('#currentStatus + div');
            
            if (status === 'running') {
                statusElement.className = 'status-badge status-running';
                statusElement.innerHTML = `<span>●</span><span>실행 중</span>`;
                if (statusText) {
                    statusText.textContent = `${checkType ? checkType.toUpperCase() : ''} 점검이 실행 중입니다...${taskId ? ` (작업 ID: ${taskId})` : ''}`;
                }
            } else {
                statusElement.className = 'status-badge status-idle';
                statusElement.innerHTML = `<span>●</span><span>대기 중</span>`;
                if (statusText) {
                    statusText.textContent = '실행 중인 작업이 없습니다.';
                }
            }
        }

        // 실행 가이드 표시
        function showExecutionGuide(checkType, playbookPath) {
            const checkTypeMap = {
                'os': 'redhat',
                'mariadb': 'mariadb',
                'postgresql': 'postgresql',
                'was': 'tomcat',
                'tomcat': 'tomcat',
                'cubrid': 'cubrid'
            };
            
            const playbookName = checkTypeMap[checkType] || checkType;
            const actualPath = `${playbookName}_check/${playbookName}_check.yml`;
            
            const guide = `
${checkType.toUpperCase()} 점검 실행 방법:

1. 터미널에서 다음 명령어 실행:
   cd /home/sth0824/ansible
   ansible-playbook -i hosts.ini ${actualPath}

2. 또는 특정 호스트만 점검:
   ansible-playbook -i hosts.ini ${actualPath} --limit nimbus-server

3. 점검 완료 후 Dashboard에서 결과 확인 가능합니다.
            `;
            alert(guide);
        }

        // 작업 상세 보기
        function viewJobDetail(job) {
            // 점검 유형에 따라 적절한 리포트 페이지로 이동
            let reportUrl = '/api/report';
            
            if (job.check_type === 'mariadb' || job.check_type === 'postgresql' || job.check_type === 'cubrid') {
                reportUrl = '/api/db-checks/report';
            } else if (job.check_type === 'os') {
                reportUrl = '/api/os-checks/report';
            } else if (job.check_type === 'was' || job.check_type === 'tomcat') {
                reportUrl = '/api/was-checks/report';
            }
            
            // 호스트명 필터 적용
            window.location.href = `${reportUrl}?hostname=${encodeURIComponent(job.hostname)}&id=${job.id}`;
        }

        // 주기적으로 데이터 갱신 (30초마다)
        function startAutoRefresh() {
            loadDashboard();
            setInterval(loadDashboard, 30000);
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            startAutoRefresh();
        });
    </script>
</body>
</html>
